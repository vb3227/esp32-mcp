name: Validate source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check server.py mcp tests scripts
      - run: ruff format --check server.py mcp tests scripts
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/check_repository.py
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: esp32-mcp-source
          path: dist/esp32-mcp-source.zip
          if-no-files-found: error
  firmware:
    strategy:
      matrix:
        environment: [esp32dev, esp32s3, esp32c3, esp32c6, esp32s2, esp32wrover, k10]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -c "import shutil; shutil.copyfile('include/board_config.example.h', 'include/board_config.h')"
      - run: pio run -e ${{ matrix.environment }}
