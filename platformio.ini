[platformio]
default_envs = esp32dev

[generic]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 4 MB flash minimum; one 3 MB application slot, no OTA updates.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.3
build_src_filter = +<core/> +<boards/generic/>
build_flags = -D MCP_PROFILE=\"esp32-generic\"

[env:esp32dev]
extends = generic
board = esp32dev

[env:esp32s3]
extends = generic
board = esp32-s3-devkitc-1
build_flags =
    -D MCP_PROFILE=\"esp32-s3\"
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = generic
board = esp32-c3-devkitm-1
build_flags = -D MCP_PROFILE=\"esp32-c3\"

[env:esp32c6]
extends = generic
board = esp32-c6-devkitc-1
build_flags =
    -D MCP_PROFILE=\"esp32-c6\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:esp32s2]
extends = generic
board = esp32-s2-saola-1
build_flags =
    -D MCP_PROFILE=\"esp32-s2\"

[env:esp32wrover]
extends = generic
board = esp-wrover-kit
build_flags =
    -D MCP_PROFILE=\"esp32-wrover\"
    -D MCP_PROFILE_WROVER=1
    -D BOARD_HAS_PSRAM

[env:k10]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<core/> +<boards/k10/>
build_flags =
    -D MCP_PROFILE=\"unihiker-k10\"
    -D MCP_PROFILE_K10=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    -Wl,--wrap=i2s_read
    -Wl,--wrap=esp_camera_fb_get
lib_deps = ${generic.lib_deps}

[env:k10_model_en]
extends = env:k10
build_flags =
    -D MCP_PROFILE=\"unihiker-k10\"
    -D MCP_PROFILE_K10=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=EN
    -Wl,--wrap=i2s_read
    -Wl,--wrap=esp_camera_fb_get
